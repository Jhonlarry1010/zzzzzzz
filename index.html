<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My VS Code Clone</title>
  <style>
    html, body, #container {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #container {
      width: 100vw;
      height: 100vh;
    }
    #editor {
      width: 100vw;
      height: 100vh;
    }
    #toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: #222;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: sans-serif;
      opacity: 0.95;
    }
  </style>
  <!-- Add Monaco Editor CDN -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
</head>
<body>
  <div id="toolbar">
    <label for="lang-select">Language: </label>
    <select id="lang-select">
      <option value="javascript">JavaScript</option>
      <option value="python">Python</option>
      <option value="css">CSS</option>
      <option value="html">HTML</option>
      <option value="typescript">TypeScript</option>
      <option value="json">JSON</option>
      <option value="java">Java</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
      <option value="csharp">C#</option>
      <option value="kotlin">Kotlin</option>
      <option value="react">React</option>
      <option value="nodejs">Node.js</option>
      <option value="flutter">Flutter</option>
    </select>
  </div>
  <div id="container" style="display:none"></div>
  <div id="editor"></div>
  <script>
    // Monaco Editor is used below for programming in various languages
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      const templates = {
        javascript: [
          'function hello() {',
          '\tconsole.log("Hello, world!");',
          '}'
        ].join('\n'),
        python: [
          'def hello():',
          '    print("Hello, world!")'
        ].join('\n'),
        css: [
          'body {',
          '    background: #222;',
          '    color: #fff;',
          '}'
        ].join('\n'),
        html: [
          '<!DOCTYPE html>',
          '<html>',
          '<head>',
          '  <title>Hello</title>',
          '</head>',
          '<body>',
          '  <h1>Hello, world!</h1>',
          '</body>',
          '</html>'
        ].join('\n'),
        typescript: [
          'function hello(name: string): void {',
          '    console.log(`Hello, ${name}!`);',
          '}'
        ].join('\n'),
        json: [
          '{',
          '  "message": "Hello, world!"',
          '}'
        ].join('\n'),
        java: [
          'public class HelloWorld {',
          '    public static void main(String[] args) {',
          '        System.out.println("Hello, world!");',
          '    }',
          '}'
        ].join('\n'),
        c: [
          '#include <stdio.h>',
          '',
          'int main() {',
          '    printf("Hello, world!\\n");',
          '    return 0;',
          '}'
        ].join('\n'),
        cpp: [
          '#include <iostream>',
          '',
          'int main() {',
          '    std::cout << "Hello, world!" << std::endl;',
          '    return 0;',
          '}'
        ].join('\n'),
        csharp: [
          'using System;',
          '',
          'class Program {',
          '    static void Main() {',
          '        Console.WriteLine("Hello, world!");',
          '    }',
          '}'
        ].join('\n'),
        kotlin: [
          'fun main() {',
          '    println("Hello, world!")',
          '}'
        ].join('\n'),
        react: [
          'import React from "react";',
          '',
          'function App() {',
          '  return <h1>Hello, world!</h1>;',
          '}',
          '',
          'export default App;'
        ].join('\n'),
        nodejs: [
          'console.log("Hello, world!");'
        ].join('\n'),
        flutter: [
          'import \'package:flutter/material.dart\';',
          '',
          'void main() => runApp(MyApp());',
          '',
          'class MyApp extends StatelessWidget {',
          '  @override',
          '  Widget build(BuildContext context) {',
          '    return MaterialApp(',
          '      home: Scaffold(',
          '        appBar: AppBar(title: Text("Hello, world!")),',
          '        body: Center(child: Text("Hello, world!")),',
          '      ),',
          '    );',
          '  }',
          '}'
        ].join('\n')
      };

      const langMap = {
        javascript: 'javascript',
        python: 'python',
        css: 'css',
        html: 'html',
        typescript: 'typescript',
        json: 'json',
        java: 'java',
        c: 'c',
        cpp: 'cpp',
        csharp: 'csharp',
        kotlin: 'kotlin',
        react: 'javascript',
        nodejs: 'javascript',
        flutter: 'dart'
      };

      let editor = monaco.editor.create(document.getElementById('editor'), {
        value: templates.javascript,
        language: 'javascript',
        theme: 'vs-dark'
      });

      document.getElementById('lang-select').addEventListener('change', function(e) {
        const lang = e.target.value;
        editor.setValue(templates[lang] || '');
        editor.updateOptions({ language: langMap[lang] || lang });
        monaco.editor.setModelLanguage(editor.getModel(), langMap[lang] || lang);
      });
    });
  </script>
</body>
</html>
