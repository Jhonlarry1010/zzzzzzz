<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VS Code UI</title>
    <link rel="stylesheet" href="vscode-ui.css">
</head>
<body>
    <div class="vscode-ui">
        <div class="sidebar">
            <!-- Sidebar content -->
            <div class="icon">📁</div>
            <div class="icon">🔍</div>
            <div class="icon">🔧</div>
        </div>
        <div class="main">
            <div class="tabs">
                <div class="tab active">File1.txt</div>
                <div class="tab">File2.js</div>
            </div>
            <div class="editor">
                <textarea></textarea>
            </div>
        </div>
        <div class="status-bar">
            <span>Ready</span>
        </div>
    </div>
    <script src="vscode-ui.js"></script>
</body>
</html>
